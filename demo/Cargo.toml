[package]
name = "demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sandbox scenarios for Permis à points: demo, attack, sim"
default-run = "demo"

[dependencies]
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
openssl-sys = { version = "0.9", features = ["vendored"] }
# Pure rules module, reused by `make sim` and to build the JSON arguments.
permis = { path = "../contracts/permis", features = ["testing"] }
# Host side: near-sdk needs a non-contract mode to build outside wasm.
near-sdk = { workspace = true, features = ["unit-testing"] }
