name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo --version
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Unit tests (rules engine, clock simulated)
        run: cargo test -p demerit
      - name: Build wasm
        run: |
          RUSTFLAGS="--cfg near" cargo build --target wasm32-unknown-unknown --release -p demerit -p missions
          ls -l target/wasm32-unknown-unknown/release/demerit.wasm target/wasm32-unknown-unknown/release/missions.wasm
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Static page smoke test
        run: cd web && node scripts/smoke.mjs
      - name: Actions module tests (CLI command + wallet link)
        run: cd web && node scripts/actions-test.mjs
      - name: Page test dependencies
        run: cd web && npm ci --no-audit --no-fund
      - name: Headless check of the three public pages (landing, app, dashboard)
        run: cd web && node scripts/v27-check.mjs
