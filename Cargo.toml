[workspace]
members = ["contracts/demerit", "contracts/missions", "demo"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "5.30.1"
borsh = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
# Smaller wasm = cheaper testnet storage (1 NEAR per 100 kB).
panic = "abort"
strip = true
